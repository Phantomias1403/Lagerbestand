{% extends 'layout.html' %}
{% block content %}
<h1>Abgerechnete Bestellungen</h1>
<!-- CSV-Import Formular -->
<form method="post" enctype="multipart/form-data" class="mb-4">
  <div class="row g-2">
    <div class="col-12 col-md-6">
      <input type="file" name="file" class="form-control" accept=".csv">
    </div>
    <div class="col-12 col-md-3 d-grid">
      <button type="submit" class="btn btn-warning">CSV-Datei importieren</button>
    </div>
  </div>
</form>
<form method="get" class="row g-2 mb-4 align-items-end">
  <div class="col-12 col-md-3">
    <label for="period" class="form-label">Zeitraum</label>
    <select id="period" name="period" class="form-select" onchange="toggleCustom(this.value)">
      <option value="all" {% if period == 'all' %}selected{% endif %}>Gesamt</option>
      <option value="30" {% if period == '30' %}selected{% endif %}>Letzte 30 Tage</option>
      <option value="90" {% if period == '90' %}selected{% endif %}>Letzte 90 Tage</option>
      <option value="365" {% if period == '365' %}selected{% endif %}>Letztes Jahr</option>
      <option value="custom" {% if period == 'custom' %}selected{% endif %}>Individuell</option>
    </select>
  </div>
  <div class="col-12 col-md-3" id="start-field" {% if period != 'custom' %}style="display:none"{% endif %}>
    <label for="start" class="form-label">Von</label>
    <input type="date" id="start" name="start" class="form-control" value="{{ start }}">
  </div>
  <div class="col-12 col-md-3" id="end-field" {% if period != 'custom' %}style="display:none"{% endif %}>
    <label for="end" class="form-label">Bis</label>
    <input type="date" id="end" name="end" class="form-control" value="{{ end }}">
  </div>
  <div class="col-12 col-md-3 d-grid">
    <button type="submit" class="btn btn-primary">Filtern</button>
  </div>
</form>
<script>
function toggleCustom(val){
  var display = val === 'custom' ? 'block' : 'none';
  document.getElementById('start-field').style.display = display;
  document.getElementById('end-field').style.display = display;
}
</script>
<div class="table-responsive">
<table class="table table-striped">
  <thead><tr><th>Rechennummer</th><th>SKU</th><th>Menge</th><th>Bestelldatum</th></tr></thead>
  <tbody>
  {% for m in movements %}
  <tr>
    <td>{{ m.invoice_number }}</td>
    <td>{{ m.article.sku }}</td>
    <td>{{ m.quantity|abs }}</td>
    <td>{{ m.timestamp.strftime('%Y-%m-%d') }}</td>
  </tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
