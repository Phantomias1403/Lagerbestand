{% extends 'layout.html' %}
{% block content %}
<h2>Mitarbeiter</h2>
<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Benutzername</th>
      <th>Bestellungen</th>
    </tr>
  </thead>
  <tbody>
    {% for u in users %}
    <tr>
      <td>{{ u.id }}</td>
      <td>{{ u.username }}</td>
      <td>{{ u.order_count }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
