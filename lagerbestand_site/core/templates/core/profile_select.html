{% extends 'core/base.html' %}
{% block title %}Profil auswählen{% endblock %}
{% block content %}
<h1>Profil auswählen</h1>
<div class="row">
    {% for user in users %}
        <div class="col-md-3 mb-3">
            <div class="card h-100 text-center">
                <div class="card-body">
                    <h5 class="card-title">{{ user.username }}</h5>
                    <a class="btn btn-outline-primary" href="{% url 'login' %}?user_id={{ user.pk }}">Anmelden</a>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
