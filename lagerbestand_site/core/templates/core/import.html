{% extends 'core/base.html' %}
{% block title %}CSV Import{% endblock %}
{% block content %}
<h1>CSV Import</h1>
<form method="post" enctype="multipart/form-data" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Upload</button>
</form>
<p class="mt-3">Erwartete Spalten: <code>name, sku, stock, category, location_primary, location_secondary, minimum_stock, price</code></p>
{% endblock %}
